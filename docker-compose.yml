version: '3.8'

# ─────────────────────────────────────────────────────────────────────────────
# Amana Docker Compose – environment-specific profiles
#
# Profiles:
#   dev      – local development (postgres + redis, persistent volume)
#   staging  – staging parity (postgres + redis, seeded synthetic data)
#   test     – CI / unit-test isolation (ephemeral in-memory postgres)
#   preview  – per-PR ephemeral stack (backend + postgres + redis)
#   full     – whole app against a local Soroban network (quickstart + escrow
#              contract auto-deployed, backend + frontend)
#
# Usage:
#   docker compose --profile dev     up -d
#   docker compose --profile staging up -d
#   docker compose --profile test    up -d
#   docker compose --profile preview up -d
#   docker compose --profile full    up
#
# Or use the helper scripts in scripts/:
#   ./scripts/dev-up.sh
#   ./scripts/staging-up.sh
#   ./scripts/test-up.sh
#   ./scripts/preview-up.sh      (see docs/preview-environments.md)
# ─────────────────────────────────────────────────────────────────────────────

x-postgres-healthcheck: &postgres-healthcheck
  test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 10s

x-redis-healthcheck: &redis-healthcheck
  test: ["CMD", "redis-cli", "ping"]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 5s

services:

  # ── Development ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-amana}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck: *postgres-healthcheck
    profiles: [dev, full]

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck: *redis-healthcheck
    profiles: [dev, full]

  # ── Staging ─────────────────────────────────────────────────────────────────
  # Mirrors production topology: same images, separate named volume, locked
  # credentials sourced from .env.staging (never committed).
  postgres-staging:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${STAGING_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${STAGING_POSTGRES_PASSWORD:-staging-password}
      POSTGRES_DB: ${STAGING_POSTGRES_DB:-amana_staging}
    # pg_stat_statements + slow-query logging so scripts/capture-slow-queries.sh
    # has data to report on — see docs/query-performance-review.md.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - log_min_duration_statement=200
    ports:
      - "${STAGING_POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    healthcheck: *postgres-healthcheck
    profiles: [staging]

  redis-staging:
    image: redis:7-alpine
    command: redis-server --requirepass ${STAGING_REDIS_PASSWORD:-staging-redis-pass}
    ports:
      - "${STAGING_REDIS_PORT:-6380}:6379"
    healthcheck: *redis-healthcheck
    profiles: [staging]

  # ── Test (CI / ephemeral) ───────────────────────────────────────────────────
  # Uses tmpfs so data never persists between test runs.
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: amana_test
    ports:
      - "${TEST_POSTGRES_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    profiles: [test]

  redis-test:
    image: redis:7-alpine
    ports:
      - "${TEST_REDIS_PORT:-6381}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    profiles: [test]

  # ── Preview (per-PR ephemeral, issue #264) ──────────────────────────────────
  # Full backend + DB + redis stack for one PR. Isolated by
  # COMPOSE_PROJECT_NAME=eziagric-pr-<n> (set by scripts/preview-up.sh), so
  # concurrent previews never share volumes, networks, or ports.
  # Host ports are offset (5435 / 6382 / 4001) to avoid colliding with
  # dev (5432/6379), test (5433/6381) and staging (5434/6380).
  postgres-preview:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${PREVIEW_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${PREVIEW_POSTGRES_PASSWORD:-preview-password}
      POSTGRES_DB: ${PREVIEW_POSTGRES_DB:-amana_preview}
    ports:
      - "${PREVIEW_POSTGRES_PORT:-5435}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PREVIEW_POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    profiles: [preview]

  redis-preview:
    image: redis:7-alpine
    ports:
      - "${PREVIEW_REDIS_PORT:-6382}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    profiles: [preview]

  backend-preview:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: ${PREVIEW_NODE_ENV:-staging}
      PORT: 4000
      DATABASE_URL: postgresql://${PREVIEW_POSTGRES_USER:-postgres}:${PREVIEW_POSTGRES_PASSWORD:-preview-password}@postgres-preview:5432/${PREVIEW_POSTGRES_DB:-amana_preview}
      REDIS_URL: redis://redis-preview:6379
      JWT_SECRET: ${PREVIEW_JWT_SECRET:-preview-jwt-secret-minimum-32-characters-xx}
      AMANA_ESCROW_CONTRACT_ID: ${PREVIEW_CONTRACT_ID:-CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC}
      USDC_CONTRACT_ID: ${PREVIEW_USDC_CONTRACT_ID:-CBIELTK6YBZJU5UP2WWQEUCY7PUJE7R6OB3NIUJKL5UH4WJQJ6HVHKX}
      ADMIN_ROUTES_ENABLED: ${PREVIEW_ADMIN_ROUTES_ENABLED:-true}
      CORS_ORIGINS: ${PREVIEW_CORS_ORIGINS:-}
      ALERT_WEBHOOK_URL: ${PREVIEW_ALERT_WEBHOOK_URL:-}
      STELLAR_NETWORK: ${PREVIEW_STELLAR_NETWORK:-testnet}
      STELLAR_RPC_URL: ${PREVIEW_STELLAR_RPC_URL:-https://soroban-testnet.stellar.org}
    ports:
      - "${PREVIEW_PORT:-4001}:4000"
    depends_on:
      postgres-preview:
        condition: service_healthy
      redis-preview:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health/ready > /dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s
    profiles: [preview]

  # ── Full stack (local Soroban network + app, issue #463) ────────────────────
  # `docker compose --profile full up` brings up postgres + redis (shared with
  # dev), a standalone Soroban network, a one-shot job that deploys and
  # initializes the escrow contract and writes its ids to the stellar_shared
  # volume, then the backend and frontend wired to those ids.
  stellar-quickstart:
    image: stellar/quickstart:latest
    command: ["--local", "--enable", "rpc"]
    ports:
      - "${FULL_STELLAR_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -X POST -H 'Content-Type: application/json' -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"getHealth\"}' http://localhost:8000/soroban/rpc | grep -q healthy"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    profiles: [full]

  contract-deployer:
    image: rust:1-bookworm
    working_dir: /workspace
    command: ["bash", "/opt/amana/deploy-contract-full-stack.sh"]
    environment:
      STELLAR_RPC_URL: http://stellar-quickstart:8000/soroban/rpc
    volumes:
      - ./contracts:/workspace/contracts:ro
      - ./scripts/deploy-contract-full-stack.sh:/opt/amana/deploy-contract-full-stack.sh:ro
      - stellar_cli:/opt/stellar
      - stellar_shared:/shared
    depends_on:
      stellar-quickstart:
        condition: service_healthy
    restart: "no"
    profiles: [full]

  backend-full:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Sources the contract ids written by contract-deployer. `set -a` exports them.
    command:
      - sh
      - -c
      - set -a && . /shared/stellar.env && set +a && npx prisma migrate deploy && node dist/index.js
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-amana}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${FULL_JWT_SECRET:-full-stack-local-jwt-secret-minimum-32-characters}
      STELLAR_NETWORK: testnet
      STELLAR_NETWORK_PASSPHRASE: "Standalone Network ; February 2017"
      STELLAR_RPC_URL: http://stellar-quickstart:8000/soroban/rpc
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "${FULL_BACKEND_PORT:-4100}:4000"
    volumes:
      - stellar_shared:/shared:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      contract-deployer:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health/ready > /dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s
    profiles: [full]

  frontend-full:
    image: node:22-alpine
    working_dir: /app
    # Dev server so NEXT_PUBLIC_* ids from contract-deployer are read at start,
    # not baked in at image build time.
    command:
      - sh
      - -c
      - set -a && . /shared/stellar.env && set +a && ([ -d node_modules/next ] || npm ci) && npm run dev -- -H 0.0.0.0 -p 3000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${FULL_BACKEND_PORT:-4100}
      NEXT_PUBLIC_API_BASE_URL: http://backend-full:4000
      NEXT_PUBLIC_STELLAR_NETWORK: "Standalone Network ; February 2017"
      NEXT_PUBLIC_STELLAR_RPC_URL: http://localhost:${FULL_STELLAR_PORT:-8000}/soroban/rpc
      NEXT_PUBLIC_RPC_URL: http://localhost:${FULL_STELLAR_PORT:-8000}/soroban/rpc
    ports:
      - "${FULL_FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend_full_node_modules:/app/node_modules
      - stellar_shared:/shared:ro
    depends_on:
      backend-full:
        condition: service_healthy
    profiles: [full]

volumes:
  postgres_data:
    driver: local
  postgres_staging_data:
    driver: local
  stellar_cli:
    driver: local
  stellar_shared:
    driver: local
  frontend_full_node_modules:
    driver: local
