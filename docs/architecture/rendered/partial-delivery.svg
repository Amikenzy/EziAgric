<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 290" width="700" height="290" role="img" aria-labelledby="title desc" data-source="docs/architecture/sequences/trade-lifecycle.md">
  <title id="title">Partial delivery sequence</title>
