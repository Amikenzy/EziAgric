  <text x="16" y="26" class="lbl" font-size="15">Partial delivery sequence</text>
  <text x="20" y="56" class="p">Buyer</text>
  <text x="185" y="56" class="p">amana_escrow</text>
  <text x="380" y="56" class="p">cNGN SAC</text>
  <text x="545" y="56" class="p">Seller</text>
  <line class="line" x1="60" y1="64" x2="60" y2="280" />
